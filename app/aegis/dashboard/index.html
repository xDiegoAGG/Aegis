<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aegis</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M2 20h20M5 20V9h5v11M14 20V5h5v15' stroke='%2314212b' stroke-width='2.4' fill='none'/%3E%3C/svg%3E">
  <link rel="preload" href="fonts/chivo-black.woff" as="font" type="font/woff" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar">
    <a class="wordmark" href="#" aria-label="Aegis">
      <svg viewBox="0 0 28 22" aria-hidden="true"><path d="M1 21h26M4 21V11h7v10M15 21V3h7v18"/></svg>
      Aegis
    </a>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="live" aria-selected="true" data-i18n="tabLive"></button>
      <button role="tab" data-tab="experiments" aria-selected="false" data-i18n="tabExperiments"></button>
    </nav>
    <p class="source" id="source"></p>
    <div class="controls">
      <button id="lang-toggle" type="button"></button>
      <button id="theme-toggle" type="button" aria-label="Theme"><svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.5a6.5 6.5 0 0 1 0 13z" fill="currentColor"/></svg></button>
    </div>
  </header>

  <main>
    <section id="tab-live" class="tab-panel">
      <div id="empty-live" class="empty" hidden>
        <h1 data-i18n="waitingTitle"></h1>
        <p data-i18n="waitingBody"></p>
        <pre>cd app
python3 -m aegis.actuator          # live
python3 -m aegis.replay --speed 5  # recorded run</pre>
      </div>

      <section class="now" aria-labelledby="verdict">
        <p id="replay-note" class="replay-note" hidden></p>
        <h1 id="verdict"></h1>
        <p id="verdict-detail" class="lead"></p>
        <div class="tanks" id="tanks"></div>
        <p class="key" id="tank-key"></p>
      </section>

      <section class="history">
        <div class="history-main">
          <h2 data-i18n="historyTitle"></h2>
          <div class="window" id="window-picker" role="group">
            <button data-window="300">5 min</button>
            <button data-window="900">15 min</button>
            <button data-window="1800">30 min</button>
            <button data-window="0" data-i18n="all"></button>
          </div>
          <div id="hero-chart"></div>
        </div>
        <aside class="history-side">
          <h2 data-i18n="decisionsTitle"></h2>
          <ol class="log" id="decisions"></ol>
        </aside>
      </section>

      <details class="tech" id="tech">
        <summary>
          <span data-i18n="techTitle"></span>
          <small data-i18n="techHint"></small>
        </summary>
        <div class="formula" id="equation"></div>
        <div class="instruments" id="live-charts"></div>
        <div class="footer-grid">
          <section>
            <h2 data-i18n="paramsTitle"></h2>
            <dl class="params" id="params"></dl>
          </section>
          <details class="cycles">
            <summary data-i18n="cyclesTitle"></summary>
            <div class="table-scroll"><table id="cycles-table"></table></div>
          </details>
        </div>
      </details>
    </section>

    <section id="tab-experiments" class="tab-panel" hidden>
      <div id="empty-experiments" class="empty" hidden>
        <h1 data-i18n="noTestsTitle"></h1>
        <p data-i18n="noTestsBody"></p>
      </div>
      <div class="compare">
        <div>
          <h1 data-i18n="experimentsTitle"></h1>
          <p class="quiet" data-i18n="runHint"></p>
          <div id="run-picker" class="runs" role="group"></div>
        </div>
        <div class="table-scroll"><table id="summary-table" class="summary"></table></div>
      </div>
      <div class="instruments" id="experiment-charts"></div>
      <section class="calibration">
        <h2 data-i18n="calibrationTitle"></h2>
        <p class="quiet" id="calibration-text"></p>
        <div class="instruments two" id="calibration-charts"></div>
      </section>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
