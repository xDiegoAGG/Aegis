# Parameters measured with real load tests

capacity_rps: 18  # requests per second before the pod starts degrading
startup_time_seconds: 13  # Tactual time until a new pod becomes Ready
sigma_rps: 2  # projected traffic error margin

risk_thresholds:
  scale_up: 0.70  # risk level from which scaling up is requested
  scale_down: 0.30  # risk level below which scaling down is allowed
  scale_down_sustained_seconds: 60  # time the risk must remain below the threshold before scaling down

sampling:
  interval_seconds: 5  # how often the collector queries Prometheus
  projection_window_seconds: 30  # window used to calculate the traffic slope

kubernetes:
  hpa_name: catalog-service
  namespace: default
  min_replicas_normal: 1
  min_replicas_scaled: 2

prometheus:
  url: "http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090"
  query_rps: 'sum(rate(http_request_duration_seconds_count{route="/"}[30s]))'
  query_p95: 'histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{route="/"}[30s])) by (le))'