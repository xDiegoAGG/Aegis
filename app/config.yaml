# What "degraded" means: P95 above L for T_d seconds. Decided by people, not measured.
degradation:
  p95_threshold_seconds: 1.0
  sustained_seconds: 15

# Decision engine: one more pod at 70% risk; one less when the risk with one pod less stays under 30% for 60 s.
risk_thresholds:
  scale_up: 0.70
  scale_down: 0.30
  scale_down_sustained_seconds: 60

# One cycle every 5 s. The slope uses the last 30 s. The 30 s rate shows the traffic of ~20 s ago (half window + one scrape).
sampling:
  interval_seconds: 5
  projection_window_seconds: 30
  metric_lag_seconds: 20

# sigma is calculated live from the projection errors: value before there are enough errors, floor, memory.
sigma:
  initial_rps: 2
  min_rps: 1.0
  window_seconds: 300
  min_errors: 6

# C and T are measured by `python3 -m aegis.calibrate` (step load on 1 pod) and saved in this ConfigMap.
calibration:
  configmap_name: aegis-calibration
  load_job_name: aegis-calibration-load
  k6_image: grafana/k6:2.3.0
  target_url: http://traefik.traefik.svc.cluster.local/api/books
  start_rps: 4
  step_rps: 2
  step_seconds: 30
  max_rps: 80
  max_error_ratio: 0.01
  repetitions: 2
  cooldown_seconds: 60
  startup_replicas: 3

# The HPA Aegis controls. maxReplicas must match kubernetes/hpa/aegis.yaml.
kubernetes:
  hpa_name: catalog-service
  deployment_name: catalog-service
  namespace: default
  min_replicas: 1
  max_replicas: 3

# Reached through the API server. Demand = requests finished at the entrance + growth of the ones waiting.
prometheus:
  namespace: monitoring
  service: prometheus-kube-prometheus-prometheus:9090
  timeout_seconds: 3
  query_rps: 'sum(rate(traefik_entrypoint_requests_total{entrypoint="web"}[30s])) + sum(deriv(traefik_open_connections{entrypoint="web"}[30s]))'
  query_p95: 'histogram_quantile(0.95, sum(rate(traefik_entrypoint_request_duration_seconds_bucket{entrypoint="web"}[30s])) by (le))'
  query_replicas_ready: 'sum(kube_deployment_status_replicas_ready{deployment="catalog-service"})'
