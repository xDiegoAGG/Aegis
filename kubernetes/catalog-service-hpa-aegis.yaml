# HPA used when Aegis is running. Same HPA object as catalog-service-hpa.yaml
# (baseline from test 04), so applying one replaces the other.
# Aegis decides the replicas through minReplicas; this HPA only follows it.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: catalog-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: catalog-service
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          # CPU limit = request (200m), so usage tops out near 100%. With the 10% HPA
          # tolerance it would need more than 104.5% to scale up: in practice it never does.
          averageUtilization: 95
  behavior:
    scaleDown:
      # Aegis already waits 60 s of low risk before lowering minReplicas (test 10).
      stabilizationWindowSeconds: 0
