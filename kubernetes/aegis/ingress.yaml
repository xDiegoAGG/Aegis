# The Aegis API for the monitor, only on the Traefik entrypoint monitor (8090), so its polls never count as demand.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aegis
  namespace: aegis-system
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: monitor
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: aegis
                port:
                  number: 8080
