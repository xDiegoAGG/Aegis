# Least privilege: read the workload and its calibration, patch only the HPA.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aegis
  namespace: aegis-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aegis
  namespace: default
rules:
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods", "endpoints", "services"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["aegis-calibration"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aegis
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aegis
subjects:
  - kind: ServiceAccount
    name: aegis
    namespace: aegis-system
---
# Node instance type and CPUs, for the calibration fingerprint.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aegis-node-reader
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aegis-node-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: aegis-node-reader
subjects:
  - kind: ServiceAccount
    name: aegis
    namespace: aegis-system
