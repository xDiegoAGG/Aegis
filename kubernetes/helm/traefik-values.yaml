# The entrance: Aegis reads the demand on web; the monitor reaches the Aegis API on monitor (8090), apart from it.
service:
  spec:
    type: ClusterIP

ports:
  monitor:
    port: 8090
    exposedPort: 8090
    protocol: TCP
    expose:
      default: true

ingressClass:
  enabled: true
  isDefaultClass: true

providers:
  kubernetesIngress:
    enabled: true

# A bucket at 1 s (L) keeps the P95 near the threshold exact.
metrics:
  prometheus:
    entryPoint: metrics
    addServicesLabels: true
    addEntryPointsLabels: true
    buckets: "0.05,0.1,0.3,0.5,1,2,5,10"
    service:
      enabled: true
    serviceMonitor:
      enabled: true
      interval: 5s
      additionalLabels:
        release: prometheus

resources:
  requests:
    cpu: 100m
    memory: 64Mi
