apiVersion: batch/v1
kind: Job
metadata:
  name: k6-ramp-demo
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: k6
          image: grafana/k6:latest
          # Use the image already in the node; with :latest Kubernetes would pull it every time
          imagePullPolicy: IfNotPresent
          args: ["run", "/scripts/test.js"]
          volumeMounts:
            - name: script
              mountPath: /scripts
      volumes:
        - name: script
          configMap:
            name: k6-ramp-demo-script
