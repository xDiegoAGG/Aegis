# DynamoDB Local with its data on disk (emptyDir): it survives minikube stop/start, not deleting the pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dynamodb-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dynamodb-local
  template:
    metadata:
      labels:
        app: dynamodb-local
    spec:
      containers:
        - name: dynamodb-local
          image: amazon/dynamodb-local:3.3.2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          args: ["-Xmx256m", "-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/data"]
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            tcpSocket:
              port: 8000
            periodSeconds: 3
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: dynamodb-local
spec:
  selector:
    app: dynamodb-local
  ports:
    - port: 8000
      targetPort: 8000
