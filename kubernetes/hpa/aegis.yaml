# Aegis decides through minReplicas; CPU 95% is never reached. No scale-down window: Aegis waits 60 s.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: catalog-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: catalog-service
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 95
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 0
